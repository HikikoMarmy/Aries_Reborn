[global]
database_path=data/aries.db
log_directory=logs
max_packet_size=1048576

[eon]
bind_ip=127.0.0.1
service_ip=127.0.0.1
lobby_port=11600
buddy_port=11601
auto_ack_unknown=1
log_packet_payloads=0
buddy_ping_interval_seconds=30
lobby_ping_interval_seconds=30

[rotk]
bind_ip=127.0.0.1
service_ip=127.0.0.1
lobby_port=11200
buddy_port=11201
auto_provision_auth_accounts=1
auto_rehash_auth_password=0

[ssx]
bind_ip=127.0.0.1
service_ip=127.0.0.1
lobby_port=11000
buddy_port=13505
auto_ack_unknown=1
log_packet_payloads=0
buddy_ping_interval_seconds=30
lobby_ping_interval_seconds=30

[madden]
bind_ip=127.0.0.1
service_ip=127.0.0.1
lobby_port=9995
buddy_port=9996
auto_ack_unknown=1
log_packet_payloads=0
buddy_ping_interval_seconds=30
lobby_ping_interval_seconds=30

[demangler]
bind_ip=127.0.0.1
service_ip=127.0.0.1
demangler_enabled=1
ports=3658
demangler_probe_count=3
demangler_session_timeout_seconds=60
